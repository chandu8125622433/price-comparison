spring.application.name=price-comparison

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/price_comparison
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Phase 3 — Product discovery (MVP: Vijay Sales only)
# Per-retailer candidate limit and overall cap. Discovery is read-only.
app.discovery.vijaysales.max-candidates=10000
app.discovery.vijaysales.max-pages=5
app.discovery.max-candidates=10

# Reliance Digital discovery walks the retailer's robots-published product
# sitemap (robots.txt disallows query-string URLs, so ?searchQuery= is never
# used) and caps the number of candidates per search.
# Category listings use up to one full UI page of actual Reliance products.
# The provider remains sitemap/public-page based and bounded; it does not use
# a blocked search endpoint or a security-control bypass.
app.discovery.reliancedigital.max-candidates=100

# Cache-first search: stored offers are served without retailer calls while
# they are this fresh; older offers are refreshed live through the existing
# refresh-prices endpoint. Configurable, used by SmartSearchService only.
price.cache.freshness-minutes=10

# --- Phase 7: Flipkart Affiliate API (official/permitted API only) ---
# Credentials are read from environment variables and are NEVER hardcoded.
# Leave them empty to run Flipkart in CONFIGURATION_REQUIRED mode: the
# provider reports its status explicitly and NO prices are fabricated.
flipkart.affiliate.id=${FLIPKART_AFFILIATE_ID:}
flipkart.affiliate.token=${FLIPKART_AFFILIATE_TOKEN:}
app.retailers.flipkart.search-result-count=5
